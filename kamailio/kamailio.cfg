#!KAMAILIO
debug=2
log_stderror=yes
children=2
listen=udp:0.0.0.0:5060 advertise @ADVERTISED_HOST@:5060
listen=tcp:0.0.0.0:5060 advertise @ADVERTISED_HOST@:5060
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "pike.so"
loadmodule "ctl.so"
loadmodule "db_postgres.so"
loadmodule "permissions.so"
loadmodule "dispatcher.so"
loadmodule "htable.so"
loadmodule "jansson.so"
loadmodule "siptrace.so"
# Mirror actual incoming/outgoing signaling to a private, local HEP receiver.
# Tracing never writes SQL or calls the management API in the SIP path.
modparam("siptrace", "trace_on", 1)
modparam("siptrace", "trace_mode", 1)
modparam("siptrace", "trace_init_mode", 1)
modparam("siptrace", "trace_to_database", 0)
modparam("siptrace", "duplicate_uri", "sip:127.0.0.1:9060")
modparam("siptrace", "hep_mode_on", 1)
modparam("siptrace", "hep_version", 3)
modparam("ctl", "binrpc", "unix:/rpc/kamailio.sock")
modparam("permissions", "db_url", "@DB_URL@")
modparam("permissions", "reload_delta", 1)
modparam("dispatcher", "db_url", "@DB_URL@")
modparam("dispatcher", "ds_load_mode", 1)
modparam("dispatcher", "reload_delta", 1)
modparam("htable", "db_url", "@DB_URL@")
modparam("htable", "htable", "runtime=>size=12;dbtable=runtime_kv;")
modparam("htable", "htable", "active=>size=2;dbtable=runtime_selector;")
modparam("htable", "htable", "ipban=>size=12;autoexpire=120;")
modparam("htable", "htable", "tempban=>size=14;autoexpire=1800;updateexpire=0;")
modparam("htable", "htable", "behavior=>size=16;autoexpire=3600;updateexpire=0;")
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 30)
modparam("pike", "remove_latency", 120)
modparam("rr", "enable_full_lr", 1)

request_route {
    force_rport();
    $var(generation) = $sht(active=>generation);
    $var(bank) = 0;
    $var(ipbank) = 0;
    if ($var(generation)==1 || $var(generation)==3) $var(bank)=1;
    if ($var(generation)>=2) $var(ipbank)=1;
    $var(domain) = $(rd{s.tolower});
    $var(key) = "" + $var(bank) + ":" + $var(domain);
    $var(cid) = 0;
    if ($sht(runtime=>$var(key)) != $null) $var(cid) = $sht(runtime=>$var(key));
    $var(logip)=$si; $var(logmethod)=$rm; $var(auto)=0; $var(replyevent)=0; $var(responsecode)=0;
    $var(trusted)=0;
    $var(globalallow)=$var(ipbank)*1000000+2;
    $var(customerallow)=$var(ipbank)*1000000+$var(cid)*2+11;
    if (allow_source_address("$var(globalallow)")) $var(trusted)=1;
    if ($var(cid)>0 && allow_source_address("$var(customerallow)")) $var(trusted)=1;
    $var(action) = "blocked";
    if (!$var(trusted) && $sht(tempban=>$si)!=$null && $sht(tempban=>$si)>$Ts) {
        $var(reason)="temporary_behavior_ban"; route(LOG);
        sl_send_reply("403","Temporarily Blocked"); exit;
    }
    if (!mf_process_maxfwd_header("10")) {
        $var(reason)="max_forwards"; route(LOG);
        sl_send_reply("483", "Too Many Hops"); exit;
    }
    # CANCEL/ACK must still complete existing transactions. Count new SIP
    # transactions when TM already knows them. Stateless OPTIONS packets
    # each count, including retransmissions.
    if (!is_method("ACK|CANCEL") && t_check_trans()) exit;
    if (!$var(trusted)) {
        $var(metric)="";
        if (is_method("INVITE") && !has_totag()) $var(metric)="invite";
        if (is_method("REGISTER")) $var(metric)="register";
        if (is_method("OPTIONS")) $var(metric)="options";
        $var(responsecode)=0; $var(detected)=0;
        if ($var(metric)!="") route(AUTO_DEFENSE);
        if ($var(detected)) { sl_send_reply("403","Temporarily Blocked"); exit; }
        $var(action)="blocked";
    }
    if (!$var(trusted) && $sht(ipban=>$si) != $null) {
        $var(reason)="temporary_flood_ban"; route(LOG);
        sl_send_reply("429", "Too Many Requests"); exit;
    }
    if (!$var(trusted) && !pike_check_req()) {
        $sht(ipban=>$si)=1;
        $var(reason)="rate_limit"; route(LOG);
        sl_send_reply("429", "Too Many Requests"); exit;
    }
    if ($(ua{s.tolower}) =~ "(friendly-scanner|sipvicious|vaxsipuseragent|sipcli|sipsak|iwar)") {
        $var(reason)="scanner"; route(LOG);
        sl_send_reply("403", "Forbidden"); exit;
    }
    route(RUNTIME_FILTERS);
    if (is_method("OPTIONS") && !has_totag()) {
        $var(action)="allowed"; $var(reason)="health_check"; route(LOG);
        sl_send_reply("200", "OK"); exit;
    }
    if (is_method("CANCEL")) {
        if (t_check_trans()) { route(SOURCE_HEADERS); $var(action)="allowed"; $var(reason)="cancel"; route(LOG); t_relay(); }
        exit;
    }
    if (has_totag()) {
        if (loose_route()) { route(RELAY); exit; }
        if (is_method("ACK") && t_check_trans()) { route(SOURCE_HEADERS); $var(action)="allowed"; $var(reason)="ack"; route(LOG); t_relay(); exit; }
        $var(reason)="no_dialog_route"; route(LOG);
        sl_send_reply("404", "No dialog route"); exit;
    }
    if (t_check_trans()) exit;
    if (is_method("INVITE|SUBSCRIBE")) record_route();
    # Unmatched domains retain the static fallback backend.
    $du = "sip:@BACKEND_HOST@:@BACKEND_PORT@";
    if ($var(cid) > 0) {
        $var(setid) = $var(bank)*1000000+$var(cid)+10;
        if (!ds_select_dst("$var(setid)", "4")) {
            $var(reason)="backend_unavailable"; route(LOG);
            sl_send_reply("503", "Backend unavailable"); exit;
        }
    }
    route(RELAY);
}
route[RELAY] {
    # Initial requests and downstream dialog requests go toward the PBX.
    # Upstream dialog requests go toward the client, not the backend.
    if (!has_totag() || is_direction("downstream")) route(SOURCE_HEADERS);
    $avp(defense_ip)=$si; $avp(defense_cid)=$var(cid);
    $avp(defense_method)=$rm;
    $avp(explorer_backend)=0;
    if (!has_totag() || is_direction("downstream")) $avp(explorer_backend)=1;
    t_on_reply("DEFENSE_REPLY");
    $var(action)="allowed"; $var(reason)="forwarded"; route(LOG);
    $avp(explorer_event)=$var(event);
    if (!t_relay()) sl_reply_error();
}
route[SOURCE_HEADERS] {
    # Reserved headers are never accepted from the sender, including duplicates
    # and differently cased names. Only socket-observed values are authoritative.
    remove_hf_re("^X-SIPShield-");
    remove_hf("X-Original-Source-IP");
    append_hf("X-SIPShield-Source-IP: $si\r\n");
    append_hf("X-SIPShield-Source-Port: $sp\r\n");
    append_hf("X-SIPShield-Transport: $proto\r\n");
    append_hf("X-SIPShield-Decision: allowed\r\n");
    if ($var(cid)>0) append_hf("X-SIPShield-Customer: $var(domain)\r\n");
    # Compatibility alias, enabled by default; never read inbound values.
    append_hf("X-Original-Source-IP: $si\r\n");
}
onreply_route[DEFENSE_REPLY] {
    $var(logip)=$avp(defense_ip); $var(logmethod)=$avp(defense_method);
    $var(cid)=$avp(defense_cid); $var(auto)=0; $var(replyevent)=1; $var(responsecode)=$rs;
    if ($var(logip)==0 || $var(logip)=="") return;
    $var(action)="allowed"; $var(reason)="backend_response";
    if (!$avp(explorer_backend)) $var(reason)="peer_response";
    route(LOG);
    if ($rs!=403 && $rs!=404) return;
    # Use current allowlist at reply time, but the original client identity.
    $var(generation)=$sht(active=>generation); $var(bank)=0; $var(ipbank)=0;
    if ($var(generation)==1 || $var(generation)==3) $var(bank)=1;
    if ($var(generation)>=2) $var(ipbank)=1;
    $var(globalallow)=$var(ipbank)*1000000+2;
    $var(customerallow)=$var(ipbank)*1000000+$var(cid)*2+11;
    if (allow_address("$var(globalallow)","$var(logip)","0")) return;
    if ($var(cid)>0 && allow_address("$var(customerallow)","$var(logip)","0")) return;
    # One terminal response per transaction, including fork/retransmit copies.
    $var(replykey)="reply:"+$ci+":"+$cs+":"+$var(logip);
    sht_lock("behavior=>$var(replykey)");
    if ($sht(behavior=>$var(replykey))!=$null) { sht_unlock("behavior=>$var(replykey)"); return; }
    $sht(behavior=>$var(replykey))=1;
    $shtex(behavior=>$var(replykey))=120;
    sht_unlock("behavior=>$var(replykey)");
    $var(metric)="response_403";
    if ($rs==404) $var(metric)="response_404";
    $var(responsecode)=$rs; $var(detected)=0;
    route(AUTO_DEFENSE);
}
route[AUTO_DEFENSE] {
    $var(scope)=0;
    route(DEFENSE_SCOPE);
    if ($var(cid)>0) { $var(scope)=$var(cid); route(DEFENSE_SCOPE); }
}
route[DEFENSE_SCOPE] {
    $var(rulekey)=""+$var(bank)+":defense:"+$var(scope)+":"+$var(metric);
    if ($sht(runtime=>$var(rulekey))==$null) return;
    $var(rulejson)=$sht(runtime=>$var(rulekey));
    $var(index)=0;
    while ($var(index)<32) {
        $var(path)="["+$var(index)+"]";
        $var(rule)="";
        if (!jansson_get("$var(path)","$var(rulejson)","$var(rule)")) return;
        if ($var(rule)==$null || $var(rule)=="") return;
        jansson_get("id","$var(rule)","$var(ruleid)");
        jansson_get("revision","$var(rule)","$var(revision)");
        jansson_get("threshold","$var(rule)","$var(threshold)");
        jansson_get("window_seconds","$var(rule)","$var(window)");
        jansson_get("block_seconds","$var(rule)","$var(duration)");
        jansson_get("action","$var(rule)","$var(mode)");
        $var(counterkey)="counter:"+$var(ruleid)+":"+$var(revision)+":"+$var(logip);
        $var(endkey)=$var(counterkey)+":end";
        sht_lock("behavior=>$var(counterkey)");
        if ($sht(behavior=>$var(endkey))==$null || $sht(behavior=>$var(endkey))<=$Ts) {
            $sht(behavior=>$var(counterkey))=0;
            $sht(behavior=>$var(endkey))=$Ts+$var(window);
            $shtex(behavior=>$var(endkey))=$var(window);
            $shtex(behavior=>$var(counterkey))=$var(window);
        }
        $sht(behavior=>$var(counterkey))=$sht(behavior=>$var(counterkey))+1;
        $var(count)=$sht(behavior=>$var(counterkey));
        sht_unlock("behavior=>$var(counterkey)");
        if ($var(count)==$var(threshold)) {
            $var(action)="would_block";
            if ($var(mode)=="block") {
                $var(action)="blocked"; $var(detected)=1;
                sht_lock("tempban=>$var(logip)");
                $var(until)=$Ts+$var(duration);
                if ($sht(tempban=>$var(logip))==$null || $sht(tempban=>$var(logip))<$var(until)) {
                    $sht(tempban=>$var(logip))=$var(until);
                    $shtex(tempban=>$var(logip))=$var(duration);
                }
                sht_unlock("tempban=>$var(logip)");
            }
            $var(reason)="auto_"+$var(metric); $var(auto)=1; route(LOG); $var(auto)=0;
        }
        $var(index)=$var(index)+1;
    }
}
route[RUNTIME_FILTERS] {
    $var(globalblock)=$var(ipbank)*1000000+1;
    $var(globalallow)=$var(globalblock)+1;
    $var(customerblock)=$var(ipbank)*1000000+$var(cid)*2+10;
    $var(customerallow)=$var(customerblock)+1;
    if (!allow_source_address("$var(globalallow)")) {
        if ($var(cid)==0 || !allow_source_address("$var(customerallow)")) {
            if (allow_source_address("$var(globalblock)")) {
                $var(reason)="blocked_ip"; route(LOG); sl_send_reply("403","Forbidden"); exit;
            }
            if ($var(cid)>0 && allow_source_address("$var(customerblock)")) {
                $var(reason)="blocked_ip"; route(LOG); sl_send_reply("403","Forbidden"); exit;
            }
        }
    }
    $var(ua)="";
    if ($ua!=$null) $var(ua)=$(ua{s.tolower});
    $var(key)=""+$var(bank)+":ua:0";
    if ($sht(runtime=>$var(key))!=$null) { $var(pattern)=$sht(runtime=>$var(key)); if ($var(ua)=~$var(pattern)) { $var(reason)="user_agent"; route(DENY); } }
    $var(key)=""+$var(bank)+":ua:"+$var(cid);
    if ($sht(runtime=>$var(key))!=$null) { $var(pattern)=$sht(runtime=>$var(key)); if ($var(ua)=~$var(pattern)) { $var(reason)="user_agent"; route(DENY); } }
    $var(key)=""+$var(bank)+":prefix:0";
    if ($sht(runtime=>$var(key))!=$null) { $var(pattern)=$sht(runtime=>$var(key)); if ($rU=~$var(pattern)) { $var(reason)="prefix"; route(DENY); } }
    $var(key)=""+$var(bank)+":prefix:"+$var(cid);
    if ($sht(runtime=>$var(key))!=$null) { $var(pattern)=$sht(runtime=>$var(key)); if ($rU=~$var(pattern)) { $var(reason)="prefix"; route(DENY); } }
}
route[DENY] { route(LOG); sl_send_reply("403","Forbidden"); exit; }
route[LOG] {
    $var(event)="{}";
    if ($var(replyevent)) $var(event)=$avp(explorer_event);
    jansson_set("integer","customer_id","$var(cid)","$var(event)");
    jansson_set("integer","timestamp","$Ts","$var(event)");
    jansson_set("string","call_id","$ci","$var(event)");
    jansson_set("string","source_ip","$var(logip)","$var(event)");
    jansson_set("string","method","$var(logmethod)","$var(event)");
    if (!$var(replyevent)) {
        jansson_set("integer","source_port","$sp","$var(event)");
        jansson_set("string","transport","$proto","$var(event)");
        jansson_set("string","from_user","$fU","$var(event)");
        jansson_set("string","from_domain","$fd","$var(event)");
        jansson_set("string","to_user","$tU","$var(event)");
        jansson_set("string","to_domain","$td","$var(event)");
        # Remove any URI password before journaling; bodies and auth are never logged.
        $var(safeuri)=$ru;
        if ($(ru{uri.passwd})!=$null && $(ru{uri.passwd})!="") $var(safeuri)=$(ru{re.subst,/:([^:@]+)@/@/});
        jansson_set("string","request_uri","$var(safeuri)","$var(event)");
        jansson_set("string","called_number","$rU","$var(event)");
        jansson_set("string","caller_id","$fU","$var(event)");
        jansson_set("string","user_agent","$ua","$var(event)");
        jansson_set("string","destination","$du","$var(event)");
        if ($du!=$null && $var(action)=="allowed" && (!has_totag() || is_direction("downstream"))) {
            jansson_set("string","backend_host","$(du{uri.host})","$var(event)");
            $var(backendport)=$(du{uri.port});
            if ($var(backendport)==$null || $var(backendport)==0) $var(backendport)=5060;
            jansson_set("integer","backend_port","$var(backendport)","$var(event)");
        }
        if ($var(action)=="blocked" && $var(responsecode)==0) {
            $var(responsecode)=403;
            if ($var(reason)=="max_forwards") $var(responsecode)=483;
            if ($var(reason)=="temporary_flood_ban" || $var(reason)=="rate_limit") $var(responsecode)=429;
            if ($var(reason)=="no_dialog_route") $var(responsecode)=404;
            if ($var(reason)=="backend_unavailable") $var(responsecode)=503;
        }
        if ($var(reason)=="health_check") $var(responsecode)=200;
        if ($var(responsecode)>0) {
            $var(localreason)="Forbidden";
            if ($var(responsecode)==200) $var(localreason)="OK";
            if ($var(responsecode)==429) $var(localreason)="Too Many Requests";
            if ($var(responsecode)==483) $var(localreason)="Too Many Hops";
            if ($var(responsecode)==404) $var(localreason)="No dialog route";
            if ($var(responsecode)==503) $var(localreason)="Backend unavailable";
            if ($var(reason)=="temporary_behavior_ban" || ($var(auto) && $var(action)=="blocked")) $var(localreason)="Temporarily Blocked";
            jansson_set("string","response_reason","$var(localreason)","$var(event)");
        }
    }
    if ($var(responsecode)>0) jansson_set("integer","response_code","$var(responsecode)","$var(event)");
    if ($var(replyevent)) jansson_set("string","response_reason","$rr","$var(event)");
    jansson_set("string","action","$var(action)","$var(event)");
    jansson_set("string","reason","$var(reason)","$var(event)");
    if ($var(auto)) {
        jansson_set("integer","behavior_rule_id","$var(ruleid)","$var(event)");
        jansson_set("integer","threshold","$var(threshold)","$var(event)");
        jansson_set("integer","window_seconds","$var(window)","$var(event)");
        jansson_set("integer","block_seconds","$var(duration)","$var(event)");
        if ($var(responsecode)>0) jansson_set("integer","response_code","$var(responsecode)","$var(event)");
    }
    xlog("L_INFO","SIPSHIELD_EVENT $var(event)\n");
}
